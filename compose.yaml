services:

  tvs-ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile

    image: tvs-ai-gateway:latest
    container_name: tvs-ai-gateway

    restart: unless-stopped

    ports:
      - "7072:7072"

    env_file:
      - .env

    # tv-sales-agent runs as a Java process on the Docker host.
    # This mapping also makes host.docker.internal available on Linux Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      TZ: Asia/Seoul

    # Persist request projections and pending clarification context across
    # container replacement during production deployments.
    volumes:
      - tvs-ai-gateway-data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:7072/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tvs-ai-gateway-data:
